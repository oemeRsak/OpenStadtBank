<header class="sticky top-0 flex justify-between items-center px-6 py-3 bg-white">

    <div>
        <h2 class="text-xl font-bold">
            Welcome, {{ request.user.first_name|default:"Administrator" }}
        </h2>
        <p class="text-sm text-gray-500">
            {{ today|date:"F d, Y" }}
        </p>
    </div>

    <div class="flex gap-3 items-center">
        <button class="px-4 py-2 bg-blue-600 text-white rounded-full">
            Add Customer
        </button>
    </div>

</header>
